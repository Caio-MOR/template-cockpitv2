name: gitleaks

# Portão de segredos: todo push e toda PR passam pela varredura do histórico completo
# — o scan local continua valendo, mas deixa de depender de alguém lembrar de rodar.
# Binário pinado por versão E por checksum: baixar-e-executar sem conferir o hash é
# confiar no servidor de download com o token do repo na mão.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  segredos:
    name: varredura-de-segredos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (histórico completo p/ varredura)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Baixar gitleaks e conferir checksum
        run: |
          curl --fail --proto '=https' --tlsv1.2 --location --silent --show-error \
            -o gitleaks_8.30.1_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks

      - name: Varredura de segredos (gitleaks)
        run: ./gitleaks detect --source . --no-banner --redact --verbose
